name: Build APK

# Builds a signed, installable APK on GitHub's servers and attaches it to a Release.
#
#   git tag v1.0.0 && git push origin v1.0.0     ->  builds and publishes a Release
#   Actions tab > "Build APK" > Run workflow     ->  builds only (download it from the run's Artifacts)
#
# Needs three repository secrets (Settings > Secrets and variables > Actions), created once:
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD  its password
#   ANDROID_KEY_ALIAS          the key's alias
# Keep the keystore safe: apps signed with a different key cannot update over the installed one.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      # Must go up with every build, or Android will not install it over the previous one.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name}" ]; then echo "::error::Missing repository secret for $name"; missing=1; fi
          done
          [ "$missing" = 0 ] || exit 1
          keystore="$RUNNER_TEMP/finance-tracker.p12"
          echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          # Later steps (the signing plugin during prebuild, and Gradle) read the path from here.
          echo "ANDROID_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # The runner image already includes the Android SDK; just make sure Gradle may download extra components.
      - name: Accept Android SDK licenses
        run: yes | "$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager | sort -V | tail -1)" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Generates the native Android project (icons, splash and signing come from app.json and plugins/).
      - name: Prebuild
        run: npx expo prebuild --platform android --no-install --clean

      # arm64 and armeabi-v7a cover practically every phone and keep the APK small.
      - name: Build release APK
        working-directory: android
        run: >
          ./gradlew assembleRelease --no-daemon --stacktrace
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
          -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Check it is signed with our key (not the public debug key)
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          apksigner=$(find "$ANDROID_HOME"/build-tools -name apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | tee certs.txt
          if grep -qi "Android Debug" certs.txt; then echo "::error::APK is signed with the debug key"; exit 1; fi

      - name: Name the files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/finance-tracker.apk
          (cd dist && sha256sum finance-tracker.apk > finance-tracker.apk.sha256 && cat finance-tracker.apk.sha256)
          ls -lh dist

      - name: Describe the APK (package, version, minimum Android)
        run: |
          aapt2=$(find "$ANDROID_HOME"/build-tools -name aapt2 | sort -V | tail -1)
          "$aapt2" dump badging dist/finance-tracker.apk | grep -E "^(package|sdkVersion|targetSdkVersion|application-label):|^native-code:" | tee apk-info.txt
          { echo '```'; cat apk-info.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: finance-tracker-apk
          path: dist/*

      - name: Publish the Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Finance Tracker ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/finance-tracker.apk
            dist/finance-tracker.apk.sha256
          body: |
            **Install:** download `finance-tracker.apk` on your Android phone, open it, and allow "Install unknown apps" for your browser or Files app when asked.

            Everything stays on your phone. Use **Settings > Export backup** before updating if you want a copy of your data.
